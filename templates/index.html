<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Laptop IT Support</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .app {
            width: 100%;
            max-width: 1000px;
            height: 95vh;
            margin: 20px auto;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);

            display: flex;
            flex-direction: column;
        }


        /* HEADER */

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .robot {
            font-size: 34px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 15px;
            margin-top: 4px;
            color: #d1d5db;
        }


        /* NEW CHAT BUTTON */

        .new-chat {
            border: none;
            background: #2563eb;
            color: white;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;
            font-weight: bold;
        }

        .new-chat:hover {
            background: #1d4ed8;
        }


        /* CHAT AREA */

        #chatBox {

            flex: 1;

            overflow-y: auto;

            padding: 25px;

            display: flex;
            flex-direction: column;

            gap: 15px;
        }


        /* MESSAGES */

        .message {

            max-width: 75%;

            padding: 14px 18px;

            border-radius: 15px;

            font-size: 16px;

            line-height: 1.5;

            white-space: pre-wrap;
        }


        .user {

            align-self: flex-end;

            background: #dbeafe;

            color: #111827;

            border-bottom-right-radius: 4px;
        }


        .bot {

            align-self: flex-start;

            background: #f3f4f6;

            color: #111827;

            border-bottom-left-radius: 4px;
        }


        /* INPUT AREA */

        .input-area {

            padding: 15px;

            border-top: 1px solid #ddd;

            display: flex;

            gap: 12px;

            background: white;
        }


        #messageInput {

            flex: 1;

            padding: 14px 16px;

            font-size: 16px;

            border: 2px solid #d1d5db;

            border-radius: 10px;

            outline: none;
        }


        #messageInput:focus {

            border-color: #2563eb;
        }


        #sendButton {

            background: #2563eb;

            color: white;

            border: none;

            padding: 0 25px;

            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;
        }


        #sendButton:hover {

            background: #1d4ed8;
        }


        #sendButton:disabled {

            background: #9ca3af;

            cursor: not-allowed;
        }


        /* TYPING */

        .typing {

            color: #6b7280;

            font-style: italic;

            padding: 5px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            body {
                background: white;
            }

            .app {

                width: 100%;

                height: 100vh;

                margin: 0;

                border-radius: 0;
            }

            .title {
                font-size: 21px;
            }

            .robot {
                font-size: 27px;
            }

            .message {
                max-width: 88%;
            }

            .new-chat {
                padding: 8px 10px;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <div class="header">

        <div class="title-area">

            <div class="robot">
                🤖
            </div>

            <div>

                <div class="title">
                    Laptop IT Support
                </div>

                <div class="subtitle">
                    AI Troubleshooting Assistant
                </div>

            </div>

        </div>


        <button
            class="new-chat"
            onclick="newChat()">

            + New Chat

        </button>

    </div>



    <!-- CHAT -->

    <div id="chatBox">

        <div class="message bot">

            Hello! 👋

            I'm your Laptop IT Support Assistant.

            Tell me what problem you are experiencing.

        </div>

    </div>



    <!-- INPUT -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Describe your laptop problem..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()">

            Send

        </button>

    </div>


</div>



<script>


const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const chatBox =
    document.getElementById("chatBox");



/* ENTER KEY */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);



/* ADD MESSAGE */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chatBox.appendChild(message);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}



/* SEND MESSAGE */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    /* Show user message */

    addMessage(
        message,
        "user"
    );


    input.value = "";

    sendButton.disabled = true;


    /* Typing indicator */

    const typing =
        document.createElement("div");

    typing.className =
        "typing";

    typing.textContent =
        "🤖 AI is thinking...";

    chatBox.appendChild(typing);

    chatBox.scrollTop =
        chatBox.scrollHeight;


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );


        const data =
            await response.json();


        typing.remove();


        addMessage(
            data.response,
            "bot"
        );


    }

    catch (error) {

        typing.remove();

        addMessage(
            "Sorry, I couldn't connect to the support server.",
            "bot"
        );

        console.error(error);

    }


    sendButton.disabled = false;

    input.focus();
}



/* NEW CHAT */

async function newChat() {

    try {

        await fetch(
            "/reset",
            {
                method: "POST"
            }
        );

    }

    catch (error) {

        console.error(error);

    }


    chatBox.innerHTML = "";


    addMessage(

        "Hello! 👋\n\n" +
        "I'm your Laptop IT Support Assistant.\n\n" +
        "Tell me what problem you are experiencing.",

        "bot"

    );


    input.value = "";

    input.focus();
}


</script>


</body>

</html>
